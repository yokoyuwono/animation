<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Movie Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Terang & bersih: dasar putih hangat, oranye = aksi utama, ungu = perlu perhatian/tahap sekarang. Kolom tunggal di HP, kisi di layar lebar. */
  --bg: #faf7f2;
  --panel: #ffffff;
  --panel-2: #f3ede4;
  --line: #e7ded1;
  --ink: #221b30;
  --muted: #6e6580;
  --accent: #f28a26;
  --accent-ink: #2b1703;
  --accent-text: #b8520a;
  --second: #6a4bc9;
  --good: #2f9e57;
  --bad: #d64545;
  --font-display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Press Start 2P", ui-monospace, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 var(--font-body); min-height: 100%; }
a { color: var(--accent-text); }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
button, .btn { font: 700 0.95rem var(--font-body); cursor: pointer; border-radius: 8px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 0.55rem 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; }
button:hover, .btn:hover { border-color: var(--accent); }
button:focus-visible, .btn:focus-visible, a:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid var(--second); outline-offset: 2px; }
button[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-warn { background: transparent; border-color: var(--second); color: var(--second); }
.btn-small { min-height: 36px; padding: 0.35rem 0.7rem; font-size: 0.85rem; }

/* kerangka */
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 2px solid var(--line); }
.top-inner { max-width: 1080px; margin: 0 auto; padding: 0.7rem 16px 0; display: grid; gap: 0.5rem; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
.brand h1 { font-size: 1.45rem; }
.brand h1 span { color: var(--accent); text-shadow: 1px 1px 0 var(--accent-ink); }
.stamp { color: var(--muted); font-size: 0.8rem; }
nav.tabs { display: flex; gap: 0.1rem; overflow-x: auto; }
nav.tabs a { font-family: var(--font-display); font-size: 1.05rem; color: var(--muted); text-decoration: none; padding: 0.45rem 0.6rem; white-space: nowrap; border-bottom: 3px solid transparent; }
@media (max-width: 440px) { nav.tabs a { font-size: 0.92rem; padding: 0.45rem 0.42rem; } }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--second); }
main { max-width: 1080px; margin: 0 auto; padding: 1rem 16px 4rem; display: grid; gap: 1.5rem; }
section { display: grid; gap: 0.75rem; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 0.9rem; }

/* menunggu keputusan */
.pending { display: grid; gap: 0.6rem; }
.pend { border-left: 6px solid var(--second); display: grid; gap: 0.5rem; }
.pend-title { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
.pend-title b { font-family: var(--font-display); font-size: 1.1rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }

/* jalur produksi */
.pipeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem; }
.pipe { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 0.55rem 0.4rem; text-align: center; color: var(--ink); text-decoration: none; display: grid; gap: 0.3rem; }
.pipe .n { font-family: var(--font-num); font-size: 1rem; font-variant-numeric: tabular-nums; }
.pipe .l { font-size: 0.72rem; color: var(--muted); line-height: 1.2; }
.pipe.ready { border-color: var(--good); }
@media (max-width: 420px) { .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* kartu video */
.filters { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; }
.chip { flex: none; border-radius: 999px; min-height: 36px; padding: 0.3rem 0.8rem; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.8rem; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; color: var(--ink); text-decoration: none; display: grid; grid-template-rows: auto 1fr; }
.card:hover { border-color: var(--accent); }
.card, .panel, details.box { box-shadow: 0 1px 0 var(--line), 0 3px 10px rgb(34 27 48 / 0.05); }
.thumb { aspect-ratio: 16 / 9; background: var(--panel-2); position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1rem; font-family: var(--font-display); font-size: 1.15rem; color: var(--muted);
  background: repeating-linear-gradient(45deg, var(--panel-2) 0 12px, var(--panel) 12px 24px); }
.thumb .ph[hidden] { display: none; }
.card-body { padding: 0.7rem 0.8rem 0.8rem; display: grid; gap: 0.45rem; align-content: start; }
.card-body h3 { font-size: 1.05rem; }
.meta { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; border: 2px solid currentColor; }
.s0 { color: var(--muted); } .s1, .s2 { color: var(--second); } .s3 { color: #2a7fc0; } .s4 { color: var(--accent-text); } .s5 { color: var(--good); }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.steps i { height: 6px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.steps i.done-all { background: var(--good); }
.flag { color: var(--second); font-weight: 700; font-size: 0.82rem; }

/* detail */
.back { justify-self: start; }
.detail-top { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 760px) { .detail-top { grid-template-columns: 1fr; } }
.variants { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.variants button { min-height: 32px; padding: 0.2rem 0.6rem; font-size: 0.78rem; }
.variants button[aria-pressed="true"] { border-color: var(--second); color: var(--second); }
.stage-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.stage-track div { font-size: 0.68rem; text-align: center; color: var(--muted); display: grid; gap: 4px; }
.stage-track div::before { content: ""; height: 8px; border-radius: 2px; background: var(--line); }
.stage-track div.on { color: var(--ink); }
.stage-track div.on::before { background: var(--accent); }
.stage-track div.cur { color: var(--second); font-weight: 700; }
.stage-track div.cur::before { background: var(--second); }
.rows { display: grid; gap: 0.4rem; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.55rem 0.7rem; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; flex-wrap: wrap; }
.row .num { font-family: var(--font-num); font-size: 0.7rem; color: var(--second); margin-right: 0.5rem; }
details.box { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); }
details.box > summary { cursor: pointer; padding: 0.8rem 0.9rem; font-family: var(--font-display); font-size: 1.1rem; list-style: none; display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; min-height: 44px; }
details.box > summary::after { content: "+"; font-family: var(--font-num); font-size: 0.8rem; color: var(--accent-text); }
details.box[open] > summary::after { content: "−"; }
.md { padding: 0 0.9rem 0.9rem; max-width: 72ch; overflow-wrap: anywhere; }
.md h4 { font-family: var(--font-display); font-size: 1.05rem; margin: 1rem 0 0.3rem; color: var(--accent-text); }
.md p, .md ul { margin: 0.4rem 0; }
.md ul { padding-left: 1.2rem; }
.md blockquote { margin: 0.5rem 0; padding: 0.4rem 0.7rem; border-left: 4px solid var(--second); color: var(--muted); }
.md code { background: var(--panel-2); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.88em; }
.copyblock { position: relative; margin: 0.5rem 0; }
.copyblock pre { margin: 0; white-space: pre-wrap; background: var(--bg); border: 2px dashed var(--line); border-radius: 8px; padding: 0.8rem; padding-top: 2.6rem; font: 0.88rem/1.5 var(--font-body); overflow-x: auto; }
.copyblock button { position: absolute; top: 0.4rem; right: 0.4rem; }

/* riwayat */
.day { display: grid; gap: 0.35rem; }
.day h3 { font-family: var(--font-num); font-size: 0.8rem; color: var(--second); font-weight: 400; }
.day ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.25rem; }

/* status muat / galat */
.skel { background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: var(--r); }
@keyframes shimmer { to { background-position: -200% 0; } }
.state { text-align: center; padding: 2rem 1rem; display: grid; gap: 0.8rem; justify-items: center; }
.state .big { font-family: var(--font-display); font-size: 1.3rem; }
.err { border-color: var(--bad); }

/* dialog & toast */
dialog { border: 2px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(34 27 48 / 0.45); }
.dlg { padding: 1rem; display: grid; gap: 0.8rem; }
.dlg textarea { width: 100%; min-height: 120px; resize: vertical; font: 1rem/1.4 var(--font-body); background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 0.6rem; }
.dlg .count { font-size: 0.8rem; color: var(--muted); text-align: right; }
.dlg .msg { font-size: 0.9rem; }
.dlg .msg.bad { color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 700; padding: 0.7rem 1rem; border-radius: 8px; z-index: 20; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgb(34 27 48 / 0.25); }
.toast.bad { background: var(--bad); color: #fff; }
.spin { width: 16px; height: 16px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot 0.7s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .skel, .spin { animation: none; } }
/* produksi */
.next { border-left: 6px solid var(--accent); display: grid; gap: 0.6rem; }
.next .cost { font-size: 0.88rem; color: var(--muted); }
.next .cost b { font-family: var(--font-num); font-size: 0.75rem; color: var(--second); font-weight: 400; }
.more { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.form { display: grid; gap: 0.6rem; }
.form label { font-weight: 700; font-size: 0.9rem; }
.form input, .form textarea, .form select { width: 100%; font: 1rem/1.4 var(--font-body); background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 0.6rem; min-height: 44px; }
.form textarea { min-height: 90px; resize: vertical; }
.form .hint { font-size: 0.82rem; color: var(--muted); }
.form .bad { color: var(--bad); font-size: 0.88rem; }
.jobs { display: grid; gap: 0.45rem; }
.job { display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.7rem; align-items: start; padding: 0.65rem 0.75rem; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; }
.job .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 0.35rem; grid-row: span 2; }
.job .t { font-weight: 700; }
.job .d { font-size: 0.85rem; color: var(--muted); }
.st-terkirim .dot { background: var(--muted); } .st-dikerjakan .dot { background: var(--second); animation: blink 1s steps(2) infinite; }
.st-selesai .dot { background: var(--good); } .st-gagal .dot { background: var(--bad); } .st-gagal { border-color: var(--bad); }
@keyframes blink { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .st-dikerjakan .dot { animation: none; } }
/* suara & musik */
.meter { display: grid; gap: 0.35rem; }
.meter .bar { height: 10px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); }
.meter.low .bar i { background: var(--bad); }
.meter .big { font-family: var(--font-num); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.kv { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.88rem; color: var(--muted); }
.kv b { color: var(--ink); }
.grp { font-family: var(--font-display); font-size: 1.05rem; margin-top: 0.4rem; }
.line { display: grid; grid-template-columns: auto 1fr auto; gap: 0.3rem 0.7rem; align-items: start; padding: 0.65rem 0.7rem; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; }
.line.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.line input[type=checkbox] { width: 22px; height: 22px; margin: 0.15rem 0 0; accent-color: var(--accent); }
.line .lid { font-family: var(--font-num); font-size: 0.6rem; color: var(--muted); }
.line .say { font-size: 0.85rem; color: var(--second); }
.line .side { display: grid; gap: 0.3rem; justify-items: end; }
.line .tools { grid-column: 2 / -1; display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
.st-ada { color: var(--good); } .st-baru { color: var(--accent-text); } .st-berubah { color: var(--second); }
.play { min-width: 44px; justify-content: center; }
.play[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dockbar { position: sticky; bottom: 0; z-index: 4; background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 0.7rem 0.8rem; display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; box-shadow: 0 -4px 16px rgb(34 27 48 / 0.1); }
.dockbar .sum { font-size: 0.9rem; }
.dockbar .sum b { font-family: var(--font-num); font-size: 0.75rem; }
.dockbar .warnline { color: var(--bad); font-size: 0.85rem; font-weight: 700; width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; align-items: start; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
.sfx { display: flex; flex-wrap: wrap; gap: 0.4rem; }
/* jadwal */
.pf { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 4px; color: #fff; }
.pf-youtube { background: #c8372d; } .pf-shorts { background: #e0573f; } .pf-tiktok { background: #221b30; } .pf-reels { background: var(--second); }
.agenda { display: grid; gap: 0.8rem; }
.agday h3 { font-family: var(--font-display); font-size: 1.05rem; display: flex; gap: 0.5rem; align-items: baseline; }
.agday h3 .today { font-size: 0.75rem; color: var(--accent-ink); background: var(--accent); padding: 0.05rem 0.45rem; border-radius: 4px; }
.post { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.8rem; padding: 0.7rem 0.75rem; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; }
.post .time { font-family: var(--font-num); font-size: 0.72rem; color: var(--accent-text); padding-top: 0.2rem; }
.post .cap { font-size: 0.88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post .actions { grid-column: 1 / -1; }
.post.done { opacity: 0.7; } .post.fail { border-color: var(--bad); }
.st-diminta { color: var(--muted); } .st-terjadwal { color: var(--accent-text); } .st-terunggah { color: var(--good); } .st-gagal { color: var(--bad); }
.checks { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.checks label { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 400; padding: 0.4rem 0.7rem; border: 2px solid var(--line); border-radius: 8px; min-height: 44px; cursor: pointer; }
.checks input { width: 20px; height: 20px; accent-color: var(--accent); }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.form .warn { color: var(--second); font-size: 0.88rem; font-weight: 700; }
.preview { display: grid; gap: 0.3rem; max-height: 320px; overflow: auto; border: 2px dashed var(--line); border-radius: 8px; padding: 0.5rem; }
.preview div { display: flex; gap: 0.5rem; font-size: 0.88rem; align-items: baseline; flex-wrap: wrap; }
.preview b { font-family: var(--font-num); font-size: 0.65rem; color: var(--accent-text); }
/* cari, urut & halaman */
.toolbar { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
.toolbar input, .toolbar select { font: 1rem var(--font-body); background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 0.5rem 0.7rem; min-height: 44px; width: 100%; }
.toolbar input:focus-visible, .toolbar select:focus-visible { outline: 3px solid var(--second); outline-offset: 1px; }
.search { position: relative; }
.search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-height: 36px; padding: 0.2rem 0.6rem; border: 0; background: none; color: var(--muted); }
.pager { display: flex; align-items: center; justify-content: center; gap: 0.3rem; flex-wrap: wrap; padding-top: 0.3rem; }
.pager button { min-width: 40px; justify-content: center; padding: 0.3rem 0.4rem; }
@media (max-width: 400px) { .pager { gap: 0.2rem; } .pager button { min-width: 36px; } }
.pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pager .info { width: 100%; text-align: center; font-size: 0.82rem; color: var(--muted); }
.pager .gap { color: var(--muted); padding: 0 0.2rem; }
.grid.compact { grid-template-columns: 1fr; gap: 0.5rem; }
.grid.compact .card { grid-template-columns: 120px 1fr; grid-template-rows: auto; align-items: center; }
.grid.compact .thumb .ph { font-size: 0.7rem; padding: 0.3rem; }
.grid.compact .card-body { padding: 0.5rem 0.7rem; gap: 0.3rem; }
.grid.compact .card-body h3 { font-size: 0.95rem; }
.grid.compact .steps, .grid.compact .note { display: none; }
.viewtoggle { display: flex; gap: 0.3rem; }
.viewtoggle button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); }
mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Pixel Movie <span>Studio</span></h1>
      <span class="stamp" id="stamp">Memuat data…</span>
    </div>
    <nav class="tabs" aria-label="Bagian">
      <a href="#beranda" data-tab="beranda">Beranda</a>
      <a href="#video" data-tab="video">Video</a>
      <a href="#produksi" data-tab="produksi">Produksi</a>
      <a href="#jadwal" data-tab="jadwal">Jadwal</a>
      <a href="#riwayat" data-tab="riwayat">Riwayat</a>
    </nav>
  </div>
</header>

<main id="app" aria-live="polite">
  <!-- keadaan memuat: tampil sampai data.json siap -->
  <section aria-label="Memuat">
    <div class="skel" style="height:110px"></div>
    <div class="skel" style="height:70px"></div>
    <div class="grid"><div class="skel" style="height:230px"></div><div class="skel" style="height:230px"></div><div class="skel" style="height:230px"></div></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form class="dlg" id="dlg-form" method="dialog">
    <h2 id="dlg-title">Judul</h2>
    <p id="dlg-text" class="muted" style="margin:0"></p>
    <p id="dlg-warn" style="margin:0;color:var(--second);font-weight:700" hidden></p>
    <label for="dlg-input" class="sr">Pesan untuk Claude</label>
    <textarea id="dlg-input" maxlength="1500" placeholder="Contoh: Bab 2, tokoh Pak Hasan terlalu kecil di layar terbelah."></textarea>
    <div class="count" id="dlg-count"></div>
    <div class="msg" id="dlg-msg" role="status"></div>
    <div class="actions" style="justify-content:flex-end">
      <button type="button" id="dlg-cancel">Batal</button>
      <button type="submit" class="btn-primary" id="dlg-ok">Kirim</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  let DATA = null, filter = 'semua', comments = null;

  /* ---------- tanggal ---------- */
  const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const tgl = d => { if (!d) return '—'; const [y, m, dd] = d.slice(0, 10).split('-'); return `${+dd} ${BULAN[+m - 1]} ${y}`; };

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg, bad) {
    let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 5000 : 2500);
  }

  /* ---------- salin ---------- */
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      toast('Tersalin ✓');
      if (btn) { const o = btn.textContent; btn.textContent = 'Tersalin ✓'; setTimeout(() => { btn.textContent = o; }, 1600); }
    } catch (e) {
      // cadangan: pilih teksnya supaya bisa disalin manual
      const pre = btn && btn.closest('.copyblock') && btn.closest('.copyblock').querySelector('pre');
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast('Gagal menyalin otomatis. Teks sudah dipilih, tekan lama lalu Salin.', true);
    }
  }

  /* ---------- markdown kecil (naskah & caption) ---------- */
  const COPIES = [];
  function md(src) {
    const lines = String(src).split('\n'); let out = '', list = false, i = 0;
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const endList = () => { if (list) { out += '</ul>'; list = false; } };
    while (i < lines.length) {
      const l = lines[i];
      if (/^```/.test(l)) {
        endList(); const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        const k = COPIES.push(buf.join('\n')) - 1;
        out += `<div class="copyblock"><button type="button" class="btn-small btn-primary" data-copy="${k}">Salin</button><pre>${esc(buf.join('\n'))}</pre></div>`;
      } else if (/^#{1,6} /.test(l)) { endList(); out += `<h4>${inline(l.replace(/^#+ /, ''))}</h4>`; }
      else if (/^> ?/.test(l)) { endList(); out += `<blockquote>${inline(l.replace(/^> ?/, ''))}</blockquote>`; }
      else if (/^\s*[-*] /.test(l)) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`; }
      else if (l.trim() === '') endList();
      else { endList(); out += `<p>${inline(l)}</p>`; }
      i++;
    }
    endList(); return out;
  }

  /* ---------- komentar ke Claude ---------- */
  // Kemampuan "comments" dari claude.ai: tersedia hanya di halaman artifact. Di luar itu tombol tetap ada tapi menjelaskan caranya.
  if (window.claude && claude.use) claude.use('comments').then(c => { comments = c; }).catch(() => { comments = null; });

  // Kotak permintaan (db "requests"): isi pesan disimpan di sini agar pasti terbaca Claude,
  // lalu Claude memperbarui statusnya (dikerjakan/selesai/gagal + hasil). Tampil langsung di tab Produksi.
  let db = null, REQS = null, reqNote = '';
  if (window.claude && claude.use) claude.use('db').then(d => { db = d; if (d) subscribeRequests(); }).catch(() => { db = null; });
  function subscribeRequests() {
    const t = setTimeout(() => { reqNote = 'Status antrian belum bisa dimuat; mungkin sudah usang.'; if (location.hash === '#produksi') viewProduksi(); }, 10000);
    try {
      db.collection('requests').orderBy('at', 'desc').limit(200).onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(t); reqNote = ''; }
        REQS = snap.docs.map(d => d.data());
        if (location.hash === '#produksi' || location.hash === '#beranda' || location.hash === '') route();
      }, err => { clearTimeout(t); reqNote = 'Status antrian tidak bisa dimuat (' + (err && err.code) + ').'; if (location.hash === '#produksi') viewProduksi(); });
    } catch (e) { clearTimeout(t); }
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
  const newReqId = () => { const d = new Date(); return `r-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}-${Math.random().toString(36).slice(2, 6)}`; };
  function pad2(n) { return String(n).padStart(2, '0'); }

  const dlg = $('#dlg');
  let dlgCtx = null;
  function openDialog(ctx) {
    dlgCtx = ctx;
    $('#dlg-title').textContent = ctx.title;
    $('#dlg-text').textContent = ctx.text;
    $('#dlg-warn').textContent = ctx.warn || ''; $('#dlg-warn').hidden = !ctx.warn;
    $('#dlg-input').placeholder = ctx.placeholder || 'Contoh: Bab 2, tokoh Pak Hasan terlalu kecil di layar terbelah.';
    $('#dlg-input').hidden = !ctx.input; $('#dlg-count').hidden = !ctx.input;
    $('#dlg-input').value = ctx.prefill || '';
    $('#dlg-ok').textContent = ctx.ok || 'Kirim';
    $('#dlg-msg').textContent = ''; $('#dlg-msg').className = 'msg';
    setBusy(false); updateCount();
    try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
    (ctx.input ? $('#dlg-input') : $('#dlg-ok')).focus();
  }
  function setBusy(b) {
    $('#dlg-ok').disabled = b; $('#dlg-cancel').disabled = b; $('#dlg-input').disabled = b;
    $('#dlg-ok').innerHTML = b ? '<span class="spin" aria-hidden="true"></span> Mengirim…' : esc(dlgCtx ? dlgCtx.ok || 'Kirim' : 'Kirim');
  }
  function updateCount() { const n = $('#dlg-input').value.length; $('#dlg-count').textContent = `${n} / 1500`; }
  $('#dlg-input').addEventListener('input', updateCount);
  $('#dlg-cancel').addEventListener('click', () => dlg.close());
  dlg.addEventListener('cancel', e => { if ($('#dlg-ok').disabled) e.preventDefault(); });

  $('#dlg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const ctx = dlgCtx; if (!ctx) return;
    const note = $('#dlg-input').value.trim();
    if (ctx.input && !ctx.optional && note.length < 3) { $('#dlg-msg').textContent = 'Tulis dulu apa yang perlu diubah (minimal 3 huruf).'; $('#dlg-msg').className = 'msg bad'; $('#dlg-input').focus(); return; }
    const text = ctx.compose(note);
    setBusy(true);
    const meta = ctx.job || { video: ctx.video || '', action: text.split('\n')[0].slice(0, 120) };
    const res = await sendToClaude(ctx.anchorEl, text, meta);
    setBusy(false);
    if (res.ok) { dlg.close(); toast(res.msg, res.warn); if (ctx.job && !res.saved) addLocalJob(ctx.job); if (ctx.after) ctx.after(); }
    else { $('#dlg-msg').textContent = res.msg; $('#dlg-msg').className = 'msg bad'; }
  });

  async function sendToClaude(anchorEl, text, meta = {}) {
    const dup = (REQS || []).find(r => r.text === text && (r.status === 'terkirim' || r.status === 'dikerjakan'));
    if (dup) return { ok: false, msg: `Permintaan yang sama sudah ada di antrian (#${dup.id}, status ${dup.status}). Tidak dikirim ulang.` };
    const id = newReqId();
    // 1) simpan ke kotak permintaan
    let saved = false, saveErr = null;
    if (db) {
      try {
        await withTimeout(db.collection('requests').doc(id).set({ id, text, video: meta.video || '', action: meta.action || '', status: 'terkirim', at: new Date().toISOString() }), 10000);
        saved = true;
      } catch (e) { saveErr = e && e.code; }
    }
    // 2) bangunkan Claude lewat komentar (menyebut nomor permintaan)
    let sent = false, code = null, can = 'off';
    if (comments) {
      try {
        can = comments.canSendToClaude ? await comments.canSendToClaude() : 'off';
        const anchor = await comments.anchorFor(anchorEl);
        const body = (saved ? `Permintaan #${id}\n` : '') + text;
        if (can === 'available') { await comments.sendToClaude({ anchor, text: body }); sent = true; }
        else if (!saved) { await comments.create({ anchor, text: body }); sent = true; }
      } catch (err) { code = err && err.code; }
    }
    if (saved && sent) return { ok: true, saved, msg: 'Terkirim ke Claude ✓ Status bisa dilihat di tab Produksi.' };
    if (saved) {
      const why = code ? `galat ${code}` : can === 'no_session' ? 'chat Claude sedang sibuk/tidak aktif' : can === 'writers_only' ? 'akun ini tidak bisa memanggil Claude' : 'panggilan Claude tidak tersedia di tampilan ini';
      return { ok: true, saved, warn: true, msg: `Tersimpan di antrian ✓ Claude belum terpanggil (${why}). Tidak perlu tekan ulang; Claude membacanya saat chat aktif.` };
    }
    if (sent) return { ok: true, saved, msg: can === 'available' ? 'Terkirim ke Claude.' : 'Komentar tersimpan. Claude membacanya saat dibuka lagi.' };
    if (!db && !comments) return { ok: false, msg: 'Pengiriman hanya jalan di halaman ini di claude.ai. Buka lewat tautan artifact, lalu coba lagi. Pesan masih ada di kotak.' };
    const M = {
      consent_required: 'Belum diizinkan. Tekan Kirim lagi lalu pilih Izinkan pada pertanyaan yang muncul.',
      forbidden: 'Komentar dari halaman ini dimatikan. Aktifkan lagi dari panel komentar claude.ai.',
      rate_limited: 'Terlalu cepat. Tunggu sebentar lalu kirim lagi.',
      claude_unavailable: 'Claude tidak bisa dihubungi sekarang. Coba lagi nanti.',
      unavailable: 'Layanan sedang gangguan. Coba sekali lagi sebentar lagi.',
      invalid: 'Pesan tidak bisa dikirim (terlalu panjang atau berisi karakter aneh).',
      timeout: 'Koneksi terlalu lama. Periksa internet lalu coba lagi.',
    };
    const c = code || saveErr;
    return { ok: false, msg: (M[c] || 'Gagal mengirim. Pesan masih ada di kotak; coba lagi.') + (c ? ` [${c}]` : '') };
  }


  function askChange(v, where, el) {
    openDialog({
      title: 'Minta perubahan', input: true, ok: 'Kirim ke Claude', anchorEl: el,
      text: `${v.title}${where ? ' · ' + where : ''}. Tulis apa yang perlu diubah; Claude memperbaiki lalu halaman ini diperbarui.`,
      compose: note => `[Minta perubahan] ${v.id}${where ? ' / ' + where : ''}\n${note}`,
    });
  }
  function approve(v, p, el) {
    openDialog({
      title: 'Setujui?', input: false, ok: 'Ya, setujui', anchorEl: el,
      text: `${v ? v.title : p.video}: ${p.what}. Setelah disetujui: ${p.next}.`,
      compose: () => `[Setuju] ${p.video}: ${p.what} → lanjut: ${p.next}`,
    });
  }

  /* ---------- cari, saring, halaman (dipakai semua daftar) ---------- */
  const PAGE = {};                       // halaman aktif per daftar
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const matches = (q, ...fields) => !q || norm(q).split(/\s+/).filter(Boolean).every(w => fields.some(f => norm(f).includes(w)));
  const hl = (text, q) => { const t = esc(text); if (!q) return t; let out = t; norm(q).split(/\s+/).filter(w => w.length > 1).forEach(w => { out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); return out; };
  function paginate(key, list, size) {
    const pages = Math.max(1, Math.ceil(list.length / size));
    const cur = Math.min(Math.max(1, PAGE[key] || 1), pages); PAGE[key] = cur;
    return { items: list.slice((cur - 1) * size, cur * size), cur, pages, from: list.length ? (cur - 1) * size + 1 : 0, to: Math.min(cur * size, list.length), total: list.length };
  }
  function pagerHTML(key, pg, unit) {
    if (pg.pages <= 1) return pg.total ? `<div class="pager"><span class="info">${pg.total} ${unit}</span></div>` : '';
    const nums = []; for (let i = 1; i <= pg.pages; i++) if (i === 1 || i === pg.pages || Math.abs(i - pg.cur) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…');
    return `<nav class="pager" aria-label="Halaman ${unit}">
      <button type="button" class="btn-small" data-pg="${key}" data-to="${pg.cur - 1}" ${pg.cur === 1 ? 'disabled' : ''} aria-label="Sebelumnya">‹</button>
      ${nums.map(n => n === '…' ? '<span class="gap">…</span>' : `<button type="button" class="btn-small" data-pg="${key}" data-to="${n}" ${n === pg.cur ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
      <button type="button" class="btn-small" data-pg="${key}" data-to="${pg.cur + 1}" ${pg.cur === pg.pages ? 'disabled' : ''} aria-label="Berikutnya">›</button>
      <span class="info">${pg.from}–${pg.to} dari ${pg.total} ${unit}</span></nav>`;
  }
  // kotak cari: hanya hasil yang digambar ulang, supaya ketikan tidak hilang
  function searchBox(id, val, ph) {
    return `<div class="search"><label for="${id}" class="sr">Cari</label><input id="${id}" type="search" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off" enterkeyhint="search">${val ? `<button type="button" data-clear="${id}" aria-label="Hapus pencarian">✕</button>` : ''}</div>`;
  }
  let typeT;
  function onSearch(id, fn) {
    const el = $('#' + id); if (!el) return;
    el.addEventListener('input', () => { clearTimeout(typeT); typeT = setTimeout(() => fn(el.value), 200); });
  }

  /* ---------- pekerjaan (antrian) ---------- */
  // Permintaan yang baru dikirim dari HP ini disimpan sementara di perangkat (tampil "Terkirim")
  // sampai Claude mencatatnya di studio/jobs.json dan halaman diperbarui.
  const LS = 'pms-local-jobs';
  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } };
  function addLocalJob(j) {
    const list = readLocal(); list.unshift({ ...j, id: 'local-' + Date.now(), status: 'terkirim', at: new Date().toISOString().slice(0, 10) });
    try { localStorage.setItem(LS, JSON.stringify(list.slice(0, 30))); } catch (e) {}
    if (location.hash === '#produksi') viewProduksi();
  }
  function allJobs() {
    const fromDb = (REQS || []).map(r => ({ id: r.id, video: r.video, action: r.action || (r.text || '').split('\n')[0], status: r.status || 'terkirim', at: (r.at || '').slice(0, 10), result: r.result || '' }));
    const server = [...fromDb, ...(DATA.jobs || [])];
    const local = readLocal().filter(l => !server.some(s => s.video === l.video && s.action === l.action && s.at >= l.at));
    return [...local, ...server];
  }
  const ST_LABEL = { terkirim: 'Terkirim', dikerjakan: 'Sedang dikerjakan', selesai: 'Selesai', gagal: 'Gagal' };
  function jobHTML(j) {
    const v = DATA.videos.find(x => x.id === j.video);
    return `<div class="job st-${esc(j.status)}"><span class="dot" aria-hidden="true"></span>
      <span class="t">${esc(j.action)}</span>
      <span class="d">${v ? `<a href="#v-${esc(v.id)}">${esc(v.title)}</a>` : esc(j.video || 'Ide baru')} · ${esc(ST_LABEL[j.status] || j.status)} · ${tgl(j.at)}${j.result ? ' · ' + esc(j.result) : ''}${j.status === 'gagal' ? ' · <button type="button" class="btn-small" data-retry="' + esc(j.id) + '">Ulangi</button>' : ''}</span></div>`;
  }

  // Langkah berikutnya per tahap. credit = perkiraan kredit ElevenLabs (±1 kredit/huruf).
  function nextAction(v) {
    const vo = v.vo || { lines: 0, chars: 0 };
    switch (v.stage) {
      case 0: return { label: 'Buat naskah', desc: 'Claude riset fakta lalu menulis naskah draf + skema per bab untuk Anda review.', ask: 'Arah cerita, tokoh, atau hal yang wajib ada (boleh kosong).' };
      case 1: return { label: 'Buat animasi (tanpa suara)', desc: 'Animasi dibuat dengan tempo perkiraan dan teks [draf]. Tidak memakai kredit suara.' };
      case 2: return vo.lines
        ? { label: 'Pilih kalimat & buat suara', desc: `${vo.lines} kalimat perlu suara Fikri (±${vo.chars} kredit jika semua).`, href: `#s-${v.id}` }
        : { label: 'Buat suara', desc: 'Semua kalimat sudah bersuara. Lanjutkan ke render.', disabled: true };
      case 3: return { label: 'Render semua', desc: 'Video panjang 16:9 + 9:16, semua short, thumbnail, dan paket unggah.' };
      case 4: return { label: 'Siapkan caption & paket', desc: 'Judul, deskripsi + bab, tag, caption per short, hashtag tiap platform.' };
      default: return null;
    }
  }
  const MORE = {
    2: ['Ubah animasi'], 3: ['Buat ulang suara kalimat tertentu', 'Ubah animasi'],
    4: ['Render ulang', 'Buat thumbnail baru'], 5: ['Render ulang', 'Buat thumbnail baru', 'Tulis ulang caption'],
  };
  function runAction(v, label, el, extra = {}) {
    const credit = extra.credit;
    openDialog({
      title: label, input: true, optional: true, ok: credit ? `Ya, pakai ±${credit} kredit` : 'Ya, kerjakan', anchorEl: el,
      text: `${v.title}. ${extra.desc || ''}`.trim(),
      warn: credit ? `Ini memakai kredit ElevenLabs: ±${credit} kredit (${(v.vo || {}).lines} kalimat).` : '',
      placeholder: extra.ask || 'Catatan tambahan untuk Claude (boleh kosong).',
      compose: note => `[Produksi] ${v.id}: ${label}${credit ? ` (perkiraan ±${credit} kredit, disetujui)` : ''}${note ? '\nCatatan: ' + note : ''}`,
      job: { video: v.id, action: label },
    });
  }

  function viewProduksi() {
    const jobs = allJobs();
    const active = jobs.filter(j => j.status === 'terkirim' || j.status === 'dikerjakan');
    const done = jobs.filter(j => !(j.status === 'terkirim' || j.status === 'dikerjakan'));
    app.innerHTML = `
      <section aria-labelledby="h-ide" class="panel">
        <h2 id="h-ide">Ide video baru</h2>
        <form class="form" id="idea-form" novalidate>
          <div><label for="idea-title">Judul / pertanyaan "Andaikan…"</label>
          <input id="idea-title" maxlength="120" placeholder="Andaikan Borobudur dibangun hari ini" autocomplete="off"></div>
          <div><label for="idea-note">Arah cerita (boleh kosong)</label>
          <textarea id="idea-note" maxlength="1000" placeholder="Tokoh utama, perbandingan A vs B, twist yang diinginkan…"></textarea></div>
          <div><label for="idea-step">Sampai tahap</label>
          <select id="idea-step"><option value="naskah">Naskah dulu (saya review)</option><option value="animasi">Naskah + animasi tanpa suara</option></select>
          <span class="hint">Suara tidak dibuat otomatis; selalu minta persetujuan dulu.</span></div>
          <div class="bad" id="idea-err" role="alert"></div>
          <div class="actions"><button type="submit" class="btn-primary">Kirim ide ke Claude</button></div>
        </form>
      </section>
      <section aria-labelledby="h-run">
        <div class="sec-head"><h2 id="h-run">Sedang berjalan</h2><span class="muted">${active.length}</span></div>
        ${reqNote ? `<div class="muted" role="status" style="font-size:.85rem;color:var(--second)">${esc(reqNote)}</div>` : ''}${db && REQS === null && !reqNote ? '<div class="skel" style="height:56px"></div>' : ''}
        <div class="jobs">${active.length ? active.map(jobHTML).join('') : '<div class="panel state"><span class="big">Tidak ada pekerjaan berjalan</span><span class="muted">Kirim ide baru, atau buka video lalu tekan langkah berikutnya.</span></div>'}</div>
      </section>
      <section aria-labelledby="h-done">
        <h2 id="h-done">Selesai</h2>
        <div class="jobs">${done.length ? (() => { const pg = paginate('jobs', done, 10); return pg.items.map(jobHTML).join('') + pagerHTML('jobs', pg, 'pekerjaan'); })() : '<div class="panel state"><span class="muted">Belum ada.</span></div>'}</div>
      </section>
      <section aria-labelledby="h-ready">
        <div class="sec-head"><h2 id="h-ready">Siap dilanjutkan</h2><span class="muted">tekan untuk tahap berikutnya</span></div>
        <div class="rows">${(() => { const pg = paginate('ready', DATA.videos.filter(v => v.stage < 5), 8); return pg.items.map(v => { const n = nextAction(v); return `<div class="row"><span><a href="#v-${esc(v.id)}">${esc(v.title)}</a> <span class="pill s${v.stage}" style="margin-left:.3rem">${esc(stageName(v.stage))}</span></span>${n && !n.disabled ? (n.href ? `<a class="btn btn-small btn-primary" href="${esc(n.href)}">${esc(n.label)}</a>` : `<button type="button" class="btn-small btn-primary" data-run="${esc(v.id)}">${esc(n.label)}</button>`) : ''}</div>`; }).join('') + pagerHTML('ready', pg, 'video'); })()}</div>
      </section>`;
    $('#idea-form').addEventListener('submit', e => {
      e.preventDefault();
      const title = $('#idea-title').value.trim(), note = $('#idea-note').value.trim(), step = $('#idea-step').value;
      if (title.length < 5) { $('#idea-err').textContent = 'Isi judul ide dulu (minimal 5 huruf).'; $('#idea-title').focus(); return; }
      $('#idea-err').textContent = '';
      openDialog({
        title: 'Kirim ide ini?', input: false, ok: 'Ya, kirim', anchorEl: $('#idea-form'),
        text: `"${title}" → ${step === 'naskah' ? 'Claude menulis naskah draf untuk Anda review.' : 'Claude menulis naskah lalu animasi tanpa suara.'}`,
        compose: () => `[Ide baru] ${title}\nSampai: ${step}${note ? '\nArah: ' + note : ''}`,
        job: { video: '', action: `Ide baru: ${title}` },
        after: () => { $('#idea-title').value = ''; $('#idea-note').value = ''; },
      });
    });
  }

  /* ---------- pemutar audio (satu untuk semua tombol) ---------- */
  const player = new Audio(); let playingBtn = null;
  const lbl = (btn, sym) => sym + (btn.dataset.label ? ' ' + esc(btn.dataset.label) : '');
  function stopAudio() { player.pause(); if (playingBtn) { playingBtn.setAttribute('aria-pressed', 'false'); playingBtn.innerHTML = lbl(playingBtn, '▶'); playingBtn.disabled = false; } playingBtn = null; }
  player.addEventListener('ended', stopAudio);
  player.addEventListener('playing', () => { if (playingBtn) { playingBtn.innerHTML = lbl(playingBtn, '■'); playingBtn.disabled = false; } });
  player.addEventListener('error', () => { if (playingBtn) toast('Audio gagal diputar. File belum ada di halaman ini atau koneksi terputus.', true); stopAudio(); });
  function togglePlay(btn) {
    if (playingBtn === btn) return stopAudio();
    stopAudio(); playingBtn = btn;
    btn.setAttribute('aria-pressed', 'true'); btn.innerHTML = '<span class="spin" aria-hidden="true"></span>'; btn.disabled = true;
    player.src = btn.dataset.src;
    player.play().catch(err => { if (err && err.name === 'AbortError') return; toast('Browser menolak memutar audio. Tekan sekali lagi.', true); stopAudio(); });
  }

  /* ---------- kredit ---------- */
  const fmt = n => Number(n || 0).toLocaleString('id-ID');
  const creditsLeft = () => DATA.credits ? DATA.credits.limit - DATA.credits.used : null;
  function creditMeter() {
    const c = DATA.credits; if (!c) return '<span class="muted">Sisa kredit belum dicatat.</span>';
    const left = c.limit - c.used, pct = Math.max(0, Math.min(100, left / c.limit * 100));
    return `<div class="meter ${pct < 10 ? 'low' : ''}"><div class="kv"><span>Sisa kredit ElevenLabs</span><span>reset ${tgl(c.reset)}</span></div>
      <span class="big">${fmt(left)} <span class="muted" style="font-family:var(--font-body);font-size:.85rem">dari ${fmt(c.limit)}</span></span>
      <div class="bar" role="img" aria-label="Sisa ${Math.round(pct)} persen"><i style="width:${pct}%"></i></div>
      <span class="muted" style="font-size:.78rem">Dicek ${tgl(c.checked)} · paket ${esc(c.tier || '')}</span></div>`;
  }

  /* ---------- suara & musik ---------- */
  let voFilter = 'semua', voBab = '', voq = ''; const picked = new Set(); let pickedFor = null;
  const lineCost = l => (l.speak || l.screen).length;
  function viewSuara(id) {
    const v = vById(id);
    if (!v || !(v.lines || []).length) { app.innerHTML = `<div class="panel state err"><span class="big">Belum ada kalimat suara untuk video ini</span><a class="btn" href="#v-${esc(id)}">Kembali</a></div>`; return; }
    if (pickedFor !== id) { picked.clear(); pickedFor = id; voBab = ''; voq = ''; }
    const L = v.lines;
    const cnt = { semua: L.length, perlu: L.filter(l => l.status !== 'ada').length, ada: L.filter(l => l.status === 'ada').length };
    const allGroups = [...new Set(L.map(l => l.group))];
    const shown = L.filter(l => (voFilter === 'semua' || (voFilter === 'perlu' ? l.status !== 'ada' : l.status === 'ada')) && (!voBab || l.group === voBab) && matches(voq, l.id, l.screen, l.speak));
    const groups = [...new Set(shown.map(l => l.group))];
    const ST = { ada: 'Sudah ada', baru: 'Baru', berubah: 'Teks berubah' };
    app.innerHTML = `
      <a class="btn btn-small back" href="#v-${esc(v.id)}">← ${esc(v.title)}</a>
      <section aria-labelledby="h-suara"><h2 id="h-suara">Suara & musik</h2>
        <div class="two">
          <div class="panel">${creditMeter()}</div>
          <div class="panel" style="display:grid;gap:.35rem"><span class="muted" style="font-size:.8rem">SUARA NARATOR</span>
            <b>${esc(DATA.voice.name)}</b>
            <div class="kv"><span>Model <b>${esc(DATA.voice.model)}</b></span><span>Kecepatan <b>${String(DATA.voice.speed).replace('.', ',')}×</b></span><span><b>${DATA.voice.generations}</b> generasi (hemat)</span></div></div>
        </div>
      </section>
      <section aria-labelledby="h-lines">
        <div class="sec-head"><h2 id="h-lines">Kalimat narasi</h2><span class="muted">${cnt.ada}/${cnt.semua} bersuara</span></div>
        <div class="toolbar">${searchBox('voq', voq, 'Cari kalimat atau kode (r-03)')}
          <label for="vobab" class="sr">Bab</label>
          <select id="vobab"><option value="">Semua bab</option>${allGroups.map(g => `<option value="${esc(g)}" ${g === voBab ? 'selected' : ''}>${esc(g.length > 26 ? g.slice(0, 25) + '…' : g)}</option>`).join('')}</select></div>
        <div class="filters" role="group" aria-label="Saring kalimat">
          ${[['semua', 'Semua'], ['perlu', 'Perlu dibuat'], ['ada', 'Sudah ada']].map(([k, t]) => `<button type="button" class="chip" data-vofilter="${k}" aria-pressed="${voFilter === k}">${t} (${cnt[k]})</button>`).join('')}
        </div>
        ${shown.length ? groups.map(g => `<div class="grp">${esc(g)}</div><div class="rows">${shown.filter(l => l.group === g).map(l => `
          <div class="line ${picked.has(l.id) ? 'sel' : ''}" data-line="${esc(l.id)}">
            <input type="checkbox" id="cb-${esc(l.id)}" data-pick="${esc(l.id)}" ${picked.has(l.id) ? 'checked' : ''} aria-label="Pilih ${esc(l.id)}">
            <label for="cb-${esc(l.id)}" style="display:grid;gap:.15rem;cursor:pointer">
              <span class="lid">${esc(l.id)}${l.only ? ' · khusus ' + esc(l.only) : ''}</span>
              <span>${hl(l.screen, voq)}</span>
              ${l.speak ? `<span class="say">Diucapkan: ${esc(l.speak)}</span>` : ''}
            </label>
            <span class="side">
              ${l.audio ? `<button type="button" class="btn-small play" data-src="${esc(l.audio)}" aria-pressed="false" aria-label="Putar ${esc(l.id)}">▶</button>` : ''}
            </span>
            <div class="tools"><span class="pill st-${l.status}">${ST[l.status]}</span>
              <span class="muted" style="font-size:.8rem">${l.dur ? l.dur.toFixed(1).replace('.', ',') + ' dtk · ' : ''}${lineCost(l)} huruf</span>
              <button type="button" class="btn-small btn-warn" data-respeak="${esc(l.id)}">Ubah ucapan</button></div>
          </div>`).join('')}</div>`).join('') : '<div class="panel state"><span class="big">Tidak ada kalimat di saringan ini</span></div>'}
      </section>
      <section aria-labelledby="h-musik">
        <h2 id="h-musik">Musik & efek</h2>
        <div class="panel" style="display:grid;gap:.7rem">
          ${v.music ? '' : '<span class="muted">Video ini belum memakai musik & efek bersama.</span>'}
          ${DATA.sfx.filter(x => x.name === 'music').map(m => `<div class="row" style="border:0;padding:0;background:none"><span><b>Musik latar</b> <span class="muted">· chiptune ceria, mengecil saat narasi</span></span><button type="button" class="btn-small play" data-src="${esc(m.src)}" aria-pressed="false" aria-label="Putar musik">▶</button></div>`).join('')}
          <div><span class="muted" style="font-size:.85rem">Efek suara (ketuk untuk dengar)</span>
          <div class="sfx">${DATA.sfx.filter(x => x.name !== 'music').map(x => `<button type="button" class="btn-small play" data-src="${esc(x.src)}" aria-pressed="false" data-label="${esc(x.name)}">▶ ${esc(x.name)}</button>`).join('')}</div></div>
          <div class="actions"><button type="button" class="btn-warn" data-newmusic="${esc(v.id)}">Ganti musik</button><button type="button" class="btn-warn" data-newsfx="${esc(v.id)}">Buat efek baru</button></div>
        </div>
      </section>
      <div class="dockbar" id="dock"></div>`;
    $('#vobab').addEventListener('change', e => { voBab = e.target.value; stopAudio(); viewSuara(v.id); });
    onSearch('voq', val => { voq = val; viewSuara(v.id); const el = $('#voq'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
    renderDock(v);
  }
  function renderDock(v) {
    const sel = v.lines.filter(l => picked.has(l.id));
    const cost = sel.reduce((a, l) => a + lineCost(l), 0), left = creditsLeft();
    const over = left != null && cost > left;
    const need = v.lines.filter(l => l.status !== 'ada');
    $('#dock').innerHTML = `<span class="sum">${sel.length ? `<b>${sel.length}</b> kalimat · ±<b>${fmt(cost)}</b> kredit${left != null ? ` · sisa setelahnya ${fmt(left - cost)}` : ''}` : 'Pilih kalimat yang mau dibuat suaranya.'}</span>
      <span class="actions">
        ${need.length ? `<button type="button" class="btn-small" data-pickneed="1">Pilih yang perlu (${need.length})</button>` : ''}
        ${sel.length ? '<button type="button" class="btn-small" data-pickclear="1">Kosongkan</button>' : ''}
        <button type="button" class="btn-primary" data-makevo="1" ${!sel.length || over ? 'disabled' : ''}>Buat suara</button></span>
      ${over ? `<span class="warnline">Kredit tidak cukup: butuh ±${fmt(cost)}, sisa ${fmt(left)}. Kurangi pilihan atau tunggu reset ${tgl(DATA.credits.reset)}.</span>` : ''}`;
  }
  function suaraClick(b, v) {
    if (b.dataset.vofilter) { voFilter = b.dataset.vofilter; stopAudio(); viewSuara(v.id); return true; }
    if (b.dataset.pickneed) { v.lines.filter(l => l.status !== 'ada').forEach(l => picked.add(l.id)); viewSuara(v.id); return true; }
    if (b.dataset.pickclear) { picked.clear(); viewSuara(v.id); return true; }
    if (b.dataset.makevo) {
      const sel = v.lines.filter(l => picked.has(l.id)), cost = sel.reduce((a, l) => a + lineCost(l), 0);
      openDialog({
        title: `Buat suara ${sel.length} kalimat?`, input: true, optional: true, ok: `Ya, pakai ±${fmt(cost)} kredit`, anchorEl: $('#dock'),
        text: `${v.title}: ${sel.map(l => l.id).join(', ')}. Suara Fikri, ${DATA.voice.model}, lalu dipercepat ${String(DATA.voice.speed).replace('.', ',')}×.`,
        warn: `Memakai kredit ElevenLabs ±${fmt(cost)}${creditsLeft() != null ? ` (sisa jadi ±${fmt(creditsLeft() - cost)})` : ''}.`,
        placeholder: 'Catatan intonasi (boleh kosong). Contoh: r-03 lebih pelan dan sedih.',
        compose: note => `[Suara] ${v.id}: buat suara ${sel.length} kalimat (±${cost} kredit, disetujui)\nKalimat: ${sel.map(l => l.id).join(', ')}${note ? '\nCatatan: ' + note : ''}`,
        job: { video: v.id, action: `Buat suara ${sel.length} kalimat` },
        after: () => { picked.clear(); viewSuara(v.id); },
      });
      return true;
    }
    if (b.dataset.respeak) {
      const l = v.lines.find(x => x.id === b.dataset.respeak);
      openDialog({
        title: `Ubah ucapan ${l.id}`, input: true, ok: 'Kirim ke Claude', anchorEl: b.closest('.line'), prefill: l.speak || l.screen,
        text: `Tulis ulang cara kalimat ini diucapkan (angka & singkatan ditulis seperti dibaca). Teks layar tetap: "${l.screen}"`,
        warn: `Suara kalimat ini dibuat ulang: ±${fmt(lineCost(l))} kredit.`,
        compose: note => `[Ubah ucapan] ${v.id} / ${l.id}\nUcapan baru: ${note}\nLalu buat ulang suaranya (±${note.length} kredit, disetujui).`,
        job: { video: v.id, action: `Ubah ucapan ${l.id}` },
      });
      return true;
    }
    if (b.dataset.newmusic) {
      openDialog({
        title: 'Ganti musik latar', input: true, ok: 'Kirim ke Claude', anchorEl: b,
        text: `${v.title}. Jelaskan suasana musik yang diinginkan; musik baru dibuat ±120 detik dan diputar berulang.`,
        warn: `Membuat musik memakai ±900 kredit ElevenLabs${creditsLeft() != null && creditsLeft() < 900 ? ' — sisa kredit Anda tidak cukup sekarang' : ''}.`,
        placeholder: 'Contoh: chiptune tegang tapi lucu, tempo sedang, tanpa vokal.',
        compose: note => `[Musik] ${v.id}: buat musik baru (±900 kredit, disetujui)\nSuasana: ${note}`,
        job: { video: v.id, action: 'Ganti musik latar' },
      });
      return true;
    }
    if (b.dataset.newsfx) {
      openDialog({
        title: 'Buat efek suara baru', input: true, ok: 'Kirim ke Claude', anchorEl: b,
        text: 'Efek baru masuk pustaka bersama dan bisa dipakai di semua video.',
        warn: 'Memakai ±17 kredit per efek.',
        placeholder: 'Contoh: suara pintu warung berderit, pendek.',
        compose: note => `[Efek] ${v.id}: buat efek suara baru (±17 kredit, disetujui)\nEfek: ${note}`,
        job: { video: v.id, action: 'Buat efek suara baru' },
      });
      return true;
    }
    return false;
  }

  /* ---------- jadwal posting ---------- */
  const PF = { youtube: 'YouTube', shorts: 'YT Shorts', tiktok: 'TikTok', reels: 'Reels' };
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const LSP = 'pms-local-posts';
  const readLP = () => { try { return JSON.parse(localStorage.getItem(LSP) || '[]'); } catch (e) { return []; } };
  const writeLP = l => { try { localStorage.setItem(LSP, JSON.stringify(l.slice(0, 200))); } catch (e) {} };
  const pad = n => String(n).padStart(2, '0');
  const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => isoDay(new Date());
  let pfFilter = 'semua', jrange = '30';
  function allPosts() {
    const server = DATA.schedule || [];
    const local = readLP().filter(l => !server.some(s => s.video === l.video && s.item === l.item && s.platform === l.platform && s.at === l.at));
    return [...server, ...local].sort((a, b) => a.at.localeCompare(b.at));
  }
  const itemOf = (v, key) => v && v.upload && v.upload.items.find(i => i.key === key);
  function itemLabel(v, key) {
    if (key === 'long') return 'Video panjang';
    const k = key.replace('short:', ''), c = (v.chapters || []).find(c => c.id === k);
    return 'Short · ' + (c ? c.title : k);
  }
  function captionFor(v, key, pf) {
    const it = itemOf(v, key); if (!it) return '';
    if (key === 'long') return [it.title, '', it.caption, '', it.tags.youtube].join('\n').trim();
    return [it.caption, '', it.tags[pf] || ''].join('\n').trim();
  }
  function postHTML(p, k) {
    const v = vById(p.video); const cap = captionFor(v, p.item, p.platform);
    const it = itemOf(v, p.item);
    const ck = COPIES.push(cap) - 1;
    const st = p.status || 'terjadwal';
    return `<div class="post ${st === 'terunggah' ? 'done' : ''} ${st === 'gagal' ? 'fail' : ''}" data-post="${k}">
      <span class="time">${esc(p.at.slice(11, 16))}</span>
      <span style="display:grid;gap:.25rem"><span><span class="pf pf-${esc(p.platform)}">${esc(PF[p.platform] || p.platform)}</span> <b>${esc(v ? v.title : p.video)}</b></span>
        <span class="muted" style="font-size:.85rem">${esc(itemLabel(v || {}, p.item))} · <span class="st-${esc(st)}">${esc({ diminta: 'Diminta (menunggu Claude)', terjadwal: 'Terjadwal', terunggah: 'Sudah diunggah', gagal: 'Gagal' }[st] || st)}</span></span>
        ${cap ? `<span class="cap">${esc(cap)}</span>` : '<span class="cap" style="color:var(--bad)">Caption belum ada di paket unggah.</span>'}</span>
      <div class="actions">
        ${cap ? `<button type="button" class="btn-small btn-primary" data-copy="${ck}">Salin caption</button>` : ''}
        ${it && it.file ? `<a class="btn btn-small" href="${esc(it.file)}" target="_blank" rel="noopener">Unduh video</a>` : ''}
        ${st !== 'terunggah' ? `<button type="button" class="btn-small" data-posted="${k}">Tandai sudah diunggah</button>` : (p.link ? `<a class="btn btn-small" href="${esc(p.link)}" target="_blank" rel="noopener">Lihat postingan</a>` : '')}
        ${st !== 'terunggah' ? `<button type="button" class="btn-small btn-warn" data-unpost="${k}">Batalkan</button>` : ''}
      </div></div>`;
  }
  const readyVideos = () => DATA.videos.filter(v => v.upload && v.upload.items.length);

  function viewJadwal() {
    COPIES.length = 0;
    const posts = allPosts();
    const t = today();
    const endD = new Date(); endD.setDate(endD.getDate() + (+jrange || 0)); const end = isoDay(endD);
    const shown = posts.filter(p => (pfFilter === 'semua' || p.platform === pfFilter) && (
      jrange === 'done' ? p.status === 'terunggah'
      : jrange === 'all' ? (p.at.slice(0, 10) >= t || p.status !== 'terunggah')
      : (p.at.slice(0, 10) <= end && (p.at.slice(0, 10) >= t || p.status !== 'terunggah'))));
    if (jrange === 'done') shown.reverse();
    const pgJ = paginate('jadwal', shown, 10);
    const days = [...new Set(pgJ.items.map(p => p.at.slice(0, 10)))];
    const rv = readyVideos();
    const opt = rv.map(v => `<option value="${esc(v.id)}">${esc(v.title)}</option>`).join('');
    const d0 = new Date(); d0.setDate(d0.getDate() + 1);
    app.innerHTML = `
      <section aria-labelledby="h-jad">
        <div class="sec-head"><h2 id="h-jad">Jadwal posting</h2><span class="muted">${posts.filter(p => p.status !== 'terunggah').length} akan datang</span></div>
        <div class="panel" style="display:grid;gap:.4rem;border-left:6px solid var(--second)">
          <b>Mode sekarang: pengingat + paket unggah</b>
          <span class="muted" style="font-size:.9rem">Di hari posting, buka kartu di bawah → Salin caption → Unduh video → unggah di aplikasinya → Tandai sudah diunggah. Unggah otomatis aktif setelah web sendiri jadi dan akun YouTube/TikTok/Instagram disambungkan.</span>
        </div>
        <div class="toolbar" style="grid-template-columns:1fr"><label for="jrange" class="sr">Rentang</label>
          <select id="jrange"><option value="7">7 hari ke depan</option><option value="30">30 hari ke depan</option><option value="all">Semua yang akan datang</option><option value="done">Sudah diunggah</option></select></div>
        <div class="filters" role="group" aria-label="Saring platform">
          ${[['semua', 'Semua'], ...Object.entries(PF)].map(([k, n]) => `<button type="button" class="chip" data-pffilter="${k}" aria-pressed="${pfFilter === k}">${esc(n)}</button>`).join('')}
        </div>
        <div class="agenda">${days.length ? days.map(d => {
          const dt = new Date(d + 'T00:00');
          return `<div class="agday" style="display:grid;gap:.4rem"><h3>${HARI[dt.getDay()]}, ${tgl(d)}${d === t ? '<span class="today">HARI INI</span>' : ''}</h3>
            ${pgJ.items.filter(p => p.at.startsWith(d)).map(p => postHTML(p, posts.indexOf(p))).join('')}</div>`;
        }).join('') + pagerHTML('jadwal', pgJ, 'posting') : `<div class="panel state"><span class="big">Belum ada jadwal</span><span class="muted">Pakai "Susun otomatis" untuk menjadwalkan semua short sebuah video sekaligus.</span></div>`}</div>
      </section>

      <section aria-labelledby="h-auto" class="panel">
        <h2 id="h-auto">Susun otomatis</h2>
        <form class="form" id="auto-form" novalidate>
          <div><label for="au-video">Video</label><select id="au-video">${opt}</select></div>
          <div class="row2">
            <div><label for="au-date">Mulai tanggal</label><input type="date" id="au-date" value="${isoDay(d0)}" min="${t}"></div>
            <div><label for="au-time">Jam (WIB)</label><input type="time" id="au-time" value="19:00"></div>
          </div>
          <div><label for="au-every">Jarak antar-short</label>
            <select id="au-every"><option value="1">Setiap hari</option><option value="2">Selang 1 hari</option><option value="0.5">2× sehari (jam di atas + 12.00)</option></select></div>
          <div><span style="font-weight:700;font-size:.9rem">Platform short</span>
            <div class="checks">${['shorts', 'tiktok', 'reels'].map(k => `<label><input type="checkbox" name="au-pf" value="${k}" checked> ${PF[k]}</label>`).join('')}</div></div>
          <label class="checks" style="font-weight:400"><span><input type="checkbox" id="au-long" checked> Video panjang ke YouTube di hari pertama</span></label>
          <div class="bad" id="au-err" role="alert"></div>
          <div class="warn" id="au-warn"></div>
          <div class="preview" id="au-prev" aria-live="polite"></div>
          <div class="actions"><button type="submit" class="btn-primary" id="au-send">Kirim jadwal</button></div>
        </form>
      </section>

      <section aria-labelledby="h-one" class="panel">
        <h2 id="h-one">Tambah satu posting</h2>
        <form class="form" id="one-form" novalidate>
          <div><label for="on-video">Video</label><select id="on-video">${opt}</select></div>
          <div><label for="on-item">Isi</label><select id="on-item"></select></div>
          <div><span style="font-weight:700;font-size:.9rem">Platform</span><div class="checks" id="on-pf"></div></div>
          <div class="row2">
            <div><label for="on-date">Tanggal</label><input type="date" id="on-date" value="${isoDay(d0)}" min="${t}"></div>
            <div><label for="on-time">Jam (WIB)</label><input type="time" id="on-time" value="19:00"></div>
          </div>
          <div class="bad" id="on-err" role="alert"></div>
          <div class="actions"><button type="submit" class="btn-primary">Jadwalkan</button></div>
        </form>
      </section>`;
    $('#jrange').value = jrange;
    $('#jrange').addEventListener('change', e => { jrange = e.target.value; PAGE.jadwal = 1; viewJadwal(); });
    if (!rv.length) { $('#auto-form').innerHTML = $('#one-form').innerHTML = '<span class="muted">Belum ada video yang siap diunggah (perlu render + paket unggah).</span>'; return; }
    wireAuto(); wireOne();
  }

  // Rencana dari form susun otomatis → daftar posting
  function autoPlan() {
    const v = vById($('#au-video').value), date = $('#au-date').value, time = $('#au-time').value, every = +$('#au-every').value;
    const pfs = [...document.querySelectorAll('input[name=au-pf]:checked')].map(x => x.value), withLong = $('#au-long').checked;
    const err = !date ? 'Pilih tanggal mulai.' : date < today() ? 'Tanggal mulai sudah lewat. Pilih hari ini atau sesudahnya.' : !/^\d\d:\d\d$/.test(time) ? 'Isi jam dengan benar (contoh 19:00).' : !pfs.length && !withLong ? 'Pilih minimal satu platform.' : '';
    if (err) return { err };
    const shorts = v.upload.items.filter(i => i.key.startsWith('short:'));
    const list = [], start = new Date(date + 'T' + time);
    if (withLong && itemOf(v, 'long')) list.push({ video: v.id, item: 'long', platform: 'youtube', at: `${date}T${time}` });
    shorts.forEach((it, i) => {
      let d = new Date(start);

    else if (b.dataset.filter != null) { filter = b.dataset.filter; PAGE.video = 1; viewList(); }
    else if (b.dataset.gotoFilter != null) { filter = b.dataset.gotoFilter; PAGE.video = 1; }
    else if (b.dataset.approve != null) { const p = DATA.pending[+b.dataset.approve]; approve(vById(p.video), p, b.closest('.pend') || b); }
    else if (b.dataset.changePend != null) { const p = DATA.pending[+b.dataset.changePend]; askChange(vById(p.video) || { id: p.video, title: p.video }, p.what, b.closest('.pend')); }
    else if (b.dataset.change != null) { askChange(vById(b.dataset.change), b.dataset.where || '', b.closest('.row') || b.closest('.detail-top') || b); }
    else if (b.dataset.run != null) { const v = vById(b.dataset.run), n = nextAction(v); if (n && !n.disabled) runAction(v, n.label, b.closest('.panel, .row') || b, n); }
    else if (b.dataset.more != null) { const v = vById(b.dataset.vid); runAction(v, b.dataset.more, b, { desc: 'Tulis apa yang perlu dikerjakan.', ask: 'Contoh: Bab 3 saja, kalimat i-12 diucapkan lebih pelan.' }); }
    else if (b.dataset.retry != null) { const j = allJobs().find(x => x.id === b.dataset.retry), v = j && vById(j.video); if (v) runAction(v, j.action, b); }
    else if (b.dataset.thumb != null) {
      const id = location.hash.slice(3), v = vById(id), i = +b.dataset.thumb;
      $('#thumbbox').innerHTML = thumbHTML(v, i, true);
      document.querySelectorAll('[data-thumb]').forEach(x => x.setAttribute('aria-pressed', x === b));
    }
  });

  app.addEventListener('change', e => {
    const cb = e.target.closest('[data-pick]'); if (!cb) return;
    const v = vById(location.hash.slice(3)); if (!v) return;
    cb.checked ? picked.add(cb.dataset.pick) : picked.delete(cb.dataset.pick);
    cb.closest('.line').classList.toggle('sel', cb.checked);
    renderDock(v);
  });

  /* ---------- muat data ---------- */
  async function load() {
    $('#stamp').textContent = 'Memuat data…';
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch('data.json', { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      if (!d || !Array.isArray(d.videos)) throw new Error('format data tidak dikenal');
      DATA = d;
      const g = new Date(d.generated);
      $('#stamp').textContent = `Diperbarui ${g.getDate()} ${BULAN[g.getMonth()]} ${g.getFullYear()}, ${String(g.getHours()).padStart(2, '0')}.${String(g.getMinutes()).padStart(2, '0')}`;
      route();
    } catch (err) {
      $('#stamp').textContent = 'Data gagal dimuat';
      app.innerHTML = `<div class="panel state err" role="alert"><span class="big">Data studio gagal dimuat</span>
        <span class="muted">${err.name === 'AbortError' ? 'Koneksi terlalu lama (lebih dari 15 detik).' : 'Penyebab: ' + esc(err.message)}. Periksa koneksi internet lalu coba lagi.</span>
        <button type="button" class="btn-primary" id="retry">Coba lagi</button></div>`;
      $('#retry').addEventListener('click', load);
    } finally { clearTimeout(to); }
  }
  load();
})();
</script>
</body>
</html>
