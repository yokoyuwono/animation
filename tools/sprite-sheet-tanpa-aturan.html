  p(0, 80, mode === 'kacau' ? '#6a6a4a' : '#41a6f6', 160, 7);
  pxEllipse(p, 30, 18, 10, 8, '#c2c3c7'); p(29, 14, '#f4f4f4', 2, 8);                        // tugu
  p(108, 6, '#1a1c2c', 30, 22); p(109, 7, '#e43b44', 28, 20);                              // sekolah
  p(8, 56, '#1a1c2c', 40, 18); p(9, 57, '#ffcd75', 38, 16);                                // pasar
  p(100, 54, '#1a1c2c', 20, 22); p(101, 55, '#a8a39a', 18, 20);                            // rusun
  p(126, 54, '#1a1c2c', 26, 20); p(127, 55, '#f4f4f4', 24, 18); p(137, 59, '#e43b44', 4, 10); p(134, 62, '#e43b44', 10, 4); // RS
  pxEllipse(p, 56, 45, 3, 2, '#0d0f18');                                                    // lubang galian
  for (let x = 52; x < 72; x += 6) p(x, 62, '#9c6a4a', 4, 4); for (let x = 52; x < 72; x += 6) p(x, 70, '#9c6a4a', 4, 4); // kampung

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function itemSize(it) { let w = 0, h = 0; it.frames.forEach(k => { const t = TEX[k]; if (!t) return; w += t.canvas.width * it.s + 10; h = Math.max(h, t.canvas.height * it.s); }); ctx.font = 'bold 22px monospace'; return [Math.max(w - 10, ctx.measureText(`${it.code}  ${it.name}`).width + 4), h + 46]; }
function layout(draw) {
  let y = 120;
  for (const sec of sections) {
    if (draw) { ctx.fillStyle = '#ffcd75'; ctx.font = 'bold 34px monospace'; ctx.fillText(sec.title, PAD, y + 30); }
    y += 56; let x = PAD, rowH = 0;
    for (const it of sec.items) {
      const [w, h] = itemSize(it);
      if (x + w > W - PAD) { x = PAD; y += rowH + 24; rowH = 0; }
      if (draw) drawItem(it, x, y, w, h);
      x += w + 34; rowH = Math.max(rowH, h);
    }
    y += rowH + 40;
  }
  return y + 20;
}
function drawItem(it, x, y, w, h) {
  ctx.fillStyle = '#ff00ff'; ctx.fillRect(x - 6, y - 6, w + 12, h - 34);
  let fx = x;
  it.frames.forEach(k => {
    const t = TEX[k]; if (!t) return; const tw = t.canvas.width * it.s, th = t.canvas.height * it.s;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(fx + tw / 2, y + (h - 46));
    if (it.tilt) ctx.rotate(it.tilt); if (it.squash) ctx.scale(1, it.squash);
    ctx.drawImage(t.canvas, -tw / 2, -th, tw, th); ctx.restore();
    if (it.emo && TEX[it.emo]) { const e = TEX[it.emo].canvas; ctx.imageSmoothingEnabled = false; ctx.drawImage(e, fx + tw - 10, y - 4, e.width * 5, e.height * 5); }
    fx += tw + 10;
  });
  ctx.fillStyle = '#f4f4f4'; ctx.font = 'bold 22px monospace'; ctx.fillText(`${it.code}  ${it.name}`, x, y + h - 10);
}
