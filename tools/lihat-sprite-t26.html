<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lihat sprite</title><style>body{margin:0;background:#2a2838}</style></head><body><canvas id="c"></canvas>
<script>
// Pratinjau semua tekstur dengan awalan tertentu: tools/lihat-sprite.html?awalan=ta2_&skala=3
const TEX = {};
const fakeScene = { textures: { exists: k => k in TEX, remove: k => delete TEX[k],
  createCanvas(k, w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const t = { canvas: c, getContext: () => c.getContext('2d'), refresh() {} }; TEX[k] = t; return t; } },
  anims: { exists: () => true, create() {} } };
</script>
<script src="../src/sprites.js"></script><script src="../src/sprites-map.js"></script><script src="../src/sprites-2126.js"></script>
<script>
const q = new URLSearchParams(location.search), pre = q.get('awalan') || 'ta2_', S = +(q.get('skala') || 3);
buildT26Textures(fakeScene);
const keys = Object.keys(TEX).filter(k => k.startsWith(pre) && !/_(1|2|run)$/.test(k));
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); const W = 2400;
let x = 10, y = 10, rowH = 0; const pos = [];
for (const k of keys) { const c = TEX[k].canvas, w = c.width * S, h = c.height * S + 16;
  if (x + w > W) { x = 10; y += rowH + 12; rowH = 0; } pos.push([k, x, y, w, h]); x += Math.max(w, 90) + 14; rowH = Math.max(rowH, h); }
cv.width = W; cv.height = y + rowH + 20; ctx.fillStyle = '#7fc8e8'; ctx.fillRect(0, 0, W, cv.height); ctx.imageSmoothingEnabled = false;
for (const [k, x, y, w, h] of pos) { ctx.drawImage(TEX[k].canvas, x, y, w, h - 16); ctx.fillStyle = '#1a1c2c'; ctx.font = '12px monospace'; ctx.fillText(k.slice(pre.length), x, y + h - 2); }
window.DONE = true;
</script></body></html>
