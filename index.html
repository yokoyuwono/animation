<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Pixel Movie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b12; color: #f4f4f4; font-family: "Press Start 2P", monospace; }
    body { display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    #stage { flex: 1; min-height: 0; background: #000; }
    #bar { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 8px; font-size: 10px; flex-wrap: wrap; }
    button, select { font: inherit; font-size: 10px; background: #29366f; color: #fff; border: 3px solid #f4f4f4; padding: 10px 12px; cursor: pointer; border-radius: 0; touch-action: manipulation; }
    button:hover { background: #3b5dc9; }
    button.rec { background: #b13e53; }
    #status { min-width: 120px; text-align: center; color: #ffcd75; }
    #hint { display: none; text-align: center; font-size: 9px; color: #94b0c2; padding: 6px 10px 0; line-height: 1.6; }
    body.recording #bar button, body.recording #bar select { display: none; }

    /* HP posisi tegak: tampilkan petunjuk putar layar */
    @media (orientation: portrait) and (max-width: 700px) {
      #hint { display: block; }
      #stage { flex: 0 0 auto; height: 56.25vw; }
      body { justify-content: center; }
    }
    /* HP posisi miring: bar kecil supaya video maksimal */
    @media (orientation: landscape) and (max-height: 500px) {
      #bar { padding: 4px; gap: 6px; }
      button, select { padding: 6px 8px; font-size: 8px; border-width: 2px; }
      #status { min-width: 90px; font-size: 8px; }
    }
    /* Mode layar penuh: hanya video */
    body.full #bar, body.full #hint { display: none; }
    body.full #stage { height: 100%; flex: 1; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hint">📱 Putar HP ke posisi miring (landscape) atau tekan ⛶ untuk layar penuh</div>
  <div id="bar">
    <select id="pick" aria-label="Pilih cerita">
      <option value="motor-listrik">Motor Listrik</option>
      <option value="layang-layang">Layang-Layang</option>
    </select>
    <button id="btn-restart">↺ Ulang</button>
    <button id="btn-pause">❚❚ Jeda</button>
    <button id="btn-full">⛶ Penuh</button>
    <button id="btn-rec" class="rec">● Rekam</button>
    <span id="status">Memuat...</span>
  </div>

  <script src="lib/phaser.min.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/sprites-city.js"></script>
  <script src="src/engine.js"></script>
  <script>
    // Pilih cerita lewat URL: index.html#layang-layang (atau ?story=layang-layang)
    const STORIES = ['motor-listrik', 'layang-layang'];
    const wanted = location.hash.slice(1) || new URLSearchParams(location.search).get('story');
    const storyName = STORIES.includes(wanted) ? wanted : STORIES[0];
    document.write(`<script src="stories/${storyName}.js"><\/script>`);
  </script>
  <script>
    const status = document.getElementById('status');
    const pauseBtn = document.getElementById('btn-pause');
    const pick = document.getElementById('pick');
    const recBtn = document.getElementById('btn-rec');
    let recorder = null;

    pick.value = storyName;
    pick.onchange = () => { location.hash = pick.value; location.reload(); };
    window.addEventListener('hashchange', () => location.reload());

    // Tunggu font pixel (maks 2 detik), lalu mulai film
    Promise.race([
      document.fonts.load('16px "Press Start 2P"'),
      new Promise(r => setTimeout(r, 2000)),
    ]).then(() => {
      const game = startMovie();
      game.events.on('movie-scene', (i, n) => status.textContent = `Adegan ${i}/${n}`);
      game.events.on('movie-end', () => {
        status.textContent = 'Selesai ✓';
        if (recorder) recorder.stop();
      });
    });

    function restart() {
      const sc = game.scene.getScene('movie');
      game.scene.resume('movie');
      pauseBtn.textContent = '❚❚ Jeda';
      sc.scene.restart();
    }

    document.getElementById('btn-restart').onclick = restart;

    pauseBtn.onclick = () => {
      if (game.scene.isPaused('movie')) { game.scene.resume('movie'); pauseBtn.textContent = '❚❚ Jeda'; }
      else { game.scene.pause('movie'); pauseBtn.textContent = '▶ Lanjut'; }
    };

    // Layar penuh + kunci landscape (jika HP mengizinkan).
    // Ketuk video untuk keluar dari mode penuh.
    async function enterFull() {
      document.body.classList.add('full');
      try {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } catch (e) { /* tidak didukung: tetap pakai mode penuh di halaman */ }
      setTimeout(() => game.scale.refresh(), 300);
    }
    function exitFull() {
      document.body.classList.remove('full');
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      setTimeout(() => game.scale.refresh(), 300);
    }
    document.getElementById('btn-full').onclick = enterFull;
    document.getElementById('stage').addEventListener('click', () => {
      if (document.body.classList.contains('full')) exitFull();
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && document.body.classList.contains('full')) exitFull();
    });
    window.addEventListener('resize', () => window.game && game.scale.refresh());

    // Rekam video: butuh MediaRecorder dan izin unduh (tidak tersedia di dalam halaman claude.ai)
    const embedded = window.self !== window.top;
    const recType = window.MediaRecorder && ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
      .find(t => MediaRecorder.isTypeSupported(t));
    if (embedded || !recType || !HTMLCanvasElement.prototype.captureStream) recBtn.style.display = 'none';

    recBtn.onclick = () => {
      const stream = game.canvas.captureStream(30);
      recorder = new MediaRecorder(stream, { mimeType: recType, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
      recorder.onstop = () => {
        const ext = recType.startsWith('video/mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(chunks, { type: recType.split(';')[0] }));
        a.download = (STORY.title || 'animasi').replace(/\s+/g, '-') + '.' + ext;
        a.click();
        recorder = null;
        document.body.classList.remove('recording');
        status.textContent = 'Video tersimpan ✓';
      };
      document.body.classList.add('recording');
      recorder.start();
      restart();
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') restart();
      if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
      if (e.key === 'f' || e.key === 'F') enterFull();
    });
  </script>
</body>
</html>
